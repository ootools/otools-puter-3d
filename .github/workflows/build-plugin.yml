# 构建 OTools 插件的纯前端产物并上传 artifact。
# 触发：push 到 main、PR、手动。
#
# 本 workflow 只构建前端：插件是纯前端的（无 native cdylib），
# 产物即 dist/ 这份静态资源。这里跑的是移植后的上游测试套件，
# 同时也是移植层回归：某条 shell/edits.mjs 对不上上游时，
# build.mjs 会直接报「命中 N 次，期望 M 次」。
name: build-plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验上游快照没被就地改过
        run: node scripts/sync-upstream.mjs --check

      - name: 安装依赖
        # --legacy-peer-deps：npm 10 的 arborist 在解析 vitest 5 的
        # 可选 peer（@vitest/browser-playwright）时会崩（edgesOut of null）。
        run: npm ci --legacy-peer-deps

      - name: 跑上游测试套件（跑在移植后的代码上）
        run: node scripts/test.mjs

      - name: 构建 dist/
        run: node scripts/build.mjs

      - name: 打包并自检
        run: |
          node scripts/pack-plugin.mjs
          node scripts/verify-plugin.mjs

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-dist
          path: dist/
          if-no-files-found: error

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-oplg
          path: dist-pack/
          if-no-files-found: error
